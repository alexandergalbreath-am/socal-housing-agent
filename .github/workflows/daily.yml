name: Housing search

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes, all day, every day — free on a public repo
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run daily search
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: uv run python run_daily.py

      - name: Commit updated listing data
        run: |
          git config user.name "housing-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ LISTINGS.md
          git diff --cached --quiet || git commit -m "Update listings [automated]"
          git push
